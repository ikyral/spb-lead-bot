name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the workflow only checks out code and runs checks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to commit SHAs (tags can be moved).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Same Python as the Docker image (python:3.11-slim).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      # Exactly the versions of the Docker image (requirements.lock) + dev tools. If requirements.txt
      # was changed without regenerating the lock, pip fails here on conflicting pins.
      - name: Install dependencies
        run: python -m pip install -r requirements.lock -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Tests (pytest, no network)
        run: pytest -q
