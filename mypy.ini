[mypy]
# Run from the project root: `mypy`
files = src, main.py, docker_entrypoint.py, scripts
# Production target: python:3.11-slim (Linux) from the Dockerfile.
python_version = 3.11
platform = linux
# BaseSettings fields come from the environment, so Settings() needs no arguments.
plugins = pydantic.mypy
warn_unused_ignores = True
warn_redundant_casts = True

# APScheduler 3 ships without type hints.
[mypy-apscheduler.*]
ignore_missing_imports = True
